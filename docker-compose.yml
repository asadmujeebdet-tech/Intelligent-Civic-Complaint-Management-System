version: '3.9'

services:
  mongodb:
    image: mongo:latest
    container_name: civiclens-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hackathon
    volumes:
      - mongodb_data:/data/db
    networks:
      - civiclens-network

  backend:
    build: ./backend
    container_name: civiclens-backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: "mongodb://mongodb:27017/"
      DB_NAME: "hackathon"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
    networks:
      - civiclens-network

volumes:
  mongodb_data:

networks:
  civiclens-network:
    driver: bridge
