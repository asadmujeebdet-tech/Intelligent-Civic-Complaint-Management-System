# Full CivicLens app (same UI as python run_server.py) — host on Render free tier.
# Then set APP_URL in Streamlit Cloud secrets to this service URL.

services:
  - type: web
    name: civiclens-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: python run_api.py
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: hackathon
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAP_API_KEY
        sync: false
      - key: EXTRA_ALLOWED_ORIGINS
        sync: false
