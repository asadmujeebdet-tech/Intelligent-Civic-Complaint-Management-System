[theme]
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E293B"
font = "sans serif"

[server]
headless = true
# Required for streamlit.starlette.App (FastAPI HTML UI mount on Cloud)
useStarlette = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showSidebarNavigation = false
